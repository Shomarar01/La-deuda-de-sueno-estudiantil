<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Plataforma de Bienestar</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body class="body-auth">
    <header class="nav-principal">
        <div class="nav-logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">Deuda de <span>Sueño</span></a>
        </div>
        <div class="nav-enlaces">
            <!-- Si está en login, el botón resaltado es "Crear Perfil" y viceversa -->
            <a href="registro.html" class="nav-btn-registro">Crear Perfil</a>
        </div>
    </header>

    <div class="registro-contenedor">
        <h2>Crear Cuenta</h2>
        <p class="subtitulo">Únete al Sistema de <span>Alerta Temprana</span></p>

        <form id="formRegistro">
            <div class="grupo">
                <label for="nombreAlumno">Nombre completo <span class="req">*</span></label>
                <input type="text" id="nombreAlumno" placeholder="Ej. Nombre Apellido" required>
                <div id="errorNombre" class="mensaje-error"></div>
            </div>
            <div class="grupo">
                <label for="usuario">Matrícula / Nombre de usuario <span class="req">*</span></label>
                <input type="text" id="usuario" placeholder="Ej. 219304" required>
                <!--  error de usuario -->
                <div id="errorUsuario" class="mensaje-error"></div>
            </div>

            <div class="grupo">
                <label for="password">Contraseña <span class="req">*</span></label>
                <input type="password" id="password" placeholder="Crea una contraseña segura" required>
            </div>

            <div class="grupo">
                <label for="confirmPassword">Confirmar Contraseña <span class="req">*</span></label>
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
                <!--error de contraseña -->
                <div id="mensajeError" class="mensaje-error"></div>
            </div>

            <button type="submit" id="btnEnviar" disabled>Completar Registro</button>
        </form>

        <a href="login.html" class="link-login">¿Ya tienes cuenta? Inicia sesión aquí</a>
    </div>

    <!-- LÓGICA DE VALIDACIÓN UX -->
    <script src="registro.js"></script>

</body>
</html>

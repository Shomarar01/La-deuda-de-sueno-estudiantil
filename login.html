<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Plataforma de Bienestar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-auth">
    <header class="nav-principal">
        <div class="nav-logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">Deuda de <span>Sueño</span></a>
        </div>
        <div class="nav-enlaces">
            <!-- Si está en login, el botón resaltado es "Crear Perfil" y viceversa -->
            <a href="registro.html" class="nav-btn-registro">Crear Perfil</a>
        </div>
    </header>

    <div class="login-contenedor">
        <h2>Acceso Institucional</h2>
        <p class="subtitulo">Sistema de Alerta <span>Salud Mental Estudiantil</span></p>

        <!-- El form envuelve todo ahora -->
        <form id="formLogin">
            <div class="grupo">
                <label for="usuarioLogin">Matrícula / Nombre de usuario</label>
                <input type="text" id="usuarioLogin" placeholder="Ej. 219304..." required>
            </div>

            <div class="grupo">
                <label for="passwordLogin">Contraseña</label>
                <div class="campo-password">
                    <input type="password" id="passwordLogin" placeholder="Ingresa tu contraseña" required>
                    <button class="btn-mostrar" id="btnMostrar" type="button">Mostrar</button>
                </div>
            </div>

            <button type="submit" id="btnIngresar" class="btn-submit" disabled>Iniciar Sesión</button>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
